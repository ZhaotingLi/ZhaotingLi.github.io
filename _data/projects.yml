-
  name: 'Set-Supervised Diffusion Policy: Learning Action-Chunking Diffusion through Corrections'
  time:
  description: >
    * Proposed Set-Supervised Diffusion Policy (SDP), which trains action-chunking diffusion policies from human corrections by pairing the robot's undesired action-chunks with the human's corrective action-chunks.

    * Used these pairs to construct sets of desired action-chunks and trained the diffusion policy to imitate samples from these sets, instead of only imitating positive actions.

    * Outperformed standard Diffusion Policy on real-robot Insert-T and round-table assembly tasks, with the largest gains on harder initial states and better robustness to noisy data.

  image: /img/sdp_overview.jpg
  abstract: >
    PhD research at TU Delft, published at RSS 2026 [[paper](https://www.roboticsproceedings.org/rss22/p080.pdf)] [[code](https://github.com/ZhaotingLi/Set_Supervised_DP)]
  url: https://set-supervised-diffusion-policy.github.io/
-
  name: 'CLIC: Contrastive Policy Learning from Interactive Corrections'
  time:
  description: >
    * Showed that behavior cloning, which treats each human action as an exact label, is brittle when the labels are imperfect, especially for expressive models such as energy-based models.

    * Proposed CLIC, which uses human corrections to build and refine sets of desired actions and trains the policy to place probability mass over these sets, supporting both absolute and relative corrections and multi-modal behaviors.

    * Demonstrated in simulation and real-robot experiments (Insert-T, water pouring) that CLIC is competitive with state-of-the-art methods on accurate data and substantially more robust to noisy, relative, and partial feedback.

  image: /img/clic_overview.jpg
  abstract: >
    PhD research at TU Delft [[arXiv](https://arxiv.org/abs/2502.07645)] [[code](https://github.com/clic-webpage/CLIC)]
  url: https://clic-webpage.github.io/
-
  name: 'CARE: Contact Aware and Reactive Estimator for Contact-Rich Motion Planning'
  time: 2022.10 - 2023.06
  description: >
    * Implemented a contact detection algorithm that estimates contact locations and forces from joint torque sensor data.

    * Extended the contact particle filter method to output multiple possible solutions, generalizing the state-of-the-art method to multiple-contact cases.

    * Implemented a contact-aware control framework that keeps interaction forces over the robot's whole surface below a safety threshold, for both soft and rigid contacts.

    * Extended the BiTRRT sampling-based planner to be contact-aware, and validated the framework on a Franka robot in a setup inspired by the Amazon stowing task.

  image: /img/contact-aware-control-demo.png
  abstract: >
    MSc thesis in Computational Robotics Lab (CRL), ETH Zurich; RSS 2023 workshop paper [[paper](https://arxiv.org/abs/2308.04323)] [[video](https://youtu.be/2WeYytauhNg)]
  url:  research_crl_contact
-
  name: 'Learning haptic data processing in Human Robot Collaborative Carrying Task'
  time: 2022.03 - 2022.08
  description: >
    * Proposed a learning-based force filtering method that uses the filtered-and-amplified robot-side forces as the ground truth, to reduce the noise introduced by the trotting action.

    * Designed an efficient transformer-based neural network, collected data during collaboration between humans and ANYmal with an arm, and trained the network in a supervised learning framework.

    * Tested the effectiveness of the proposed force filtering method with the admittance control framework.

  image: /img/rsl_HRCC_overview.png
  abstract: >
     Semester project in Robotic Systems Lab (RSL), ETH Zurich [[Report](https://drive.google.com/file/d/169OLYRjhD3g-8cr3lPWS1mzWGUkF9fjj/view?usp=sharing)]
  url:  research_rsl_human_robot_HRCC
