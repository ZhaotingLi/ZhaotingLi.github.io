  name: 'Learning Multi-Robot Exploration Strategy with Adaptive-QMIX algorithm'
  time: 2021.10 - 2022.02
  description: >
    * Developed the simulation environment for multi-robot exploration.

    * Proposed the adaptive-QMIX method, which adapts to a varying total number of robots.

    * Applied the proposed algorithm to the multi-robot exploration problem.

  image: /img/muti-expo.png
  abstract: >
     Based on the robot exploration project
  url: research_muti_robot_exploratiion
-
  name: 'Deep Learning for Autonomous Driving: Multi-task learning and 3D object detection'
  time: 2022.04 - 2022.07
  description: >
    * Trained neural networks based on three types of multi-task learning frameworks, and compared the effects of different hyperparameters
    and structures.

    * Proposed an adaptive weight tuning method that dynamically adjusts the weight of each task's loss during training.

    * Trained the baseline proposal refinement network, and proposed several methods to improve its performance.

  image: /img/DLAD_overview.png
  abstract: >
    Course project of Deep Learning for Autonomous Driving, ETH Zurich
  url: research_DLAD
-
  name: 'Learning Robot Exploration Strategy with Deep Reinforcement Learning'
  time: 2020.10 - 2021.07
  description: >
    * Proposed 4D point-clouds-like information, which consists of 2D points’ location information, and the corresponding 1D frontier and 1D distance information.

    * Designed the corresponding training framework based on the deep Q-Learning method and modified it to adapt to the variable action space.

    * Demonstrated the performance of the proposed method on a wide variety of unseen environments, including maps much larger than those in the training set.


  image: /img/MDP_framework.png
  abstract: >
    Research work at SUSTech, published at RA-L [[paper](https://ieeexplore.ieee.org/abstract/document/9555230)].
  url: research_Robot_exploration

-
  name: 'Efficient Heuristic Generation for Robot Path Planning'
  time: 2020.07 - 2020.10
  description: >
    * Designed a novel recurrent generative model to generate efficient heuristics for robot path planning.

    * Incrementally constructed the heuristic through the feedback of historical information.

    * Combined the generated heuristic with the RRT* algorithm to guide it to find both initial and optimal solutions faster and more efficiently.


  image: /img/exp_rrtstar.png
  abstract: >
    Research work at SUSTech, published at ICRA 2021 [[paper](https://ieeexplore.ieee.org/abstract/document/9561472)].
  url: research_gan_heuristic
-
  name: 'A sampling-based motion planning method for urban autonomous vehicles'
  time: 2019.07 - 2020.01
  description: >
    * Applied the discrete elastic-band-based motion planning method (EB planner) to generate a piecewise-linear collision-free path with dynamic programming.

    * Employed a pure pursuit controller to smooth this path, and used a spatial and speed sampling method together with a cascaded ranking method to optimize the trajectory with many hierarchical features.

    * Applied a non-conservatively defensive strategy to avoid overreacting to threats with low probability.

    * Adaptively adjusted the sampling resolution based on the environment and the objectives of the ego vehicle.

  image: /img/road_figure.jpg
  abstract: >
    Research work at UC Berkeley, published at IFAC 2020 [[paper](https://www.sciencedirect.com/science/article/pii/S2405896320332237)].
  url: research_IFAC
-
  name: 'A trajectory planning method for robot scanning system for scanning objects with unknown model'
  time: 2019.02 - 2019.06
  description: >
    * Designed an automatic and low-cost robot scanning system consisting of a Kinect camera, a UR10 robot and a line laser scanner, and calibrated the coordinate systems.

    * Proposed an online correction method based on follow-up control and scanned data to optimize the pose of the laser scanner.

    * Proposed a novel path planning method for laser scanning based on least-squares fitting and online correction, validated in many use cases under various working conditions.


  image: /img/laser_scanning_system.png
  abstract: >
    Research work at HIT, published at Neurocomputing 2020 [[paper](https://www.sciencedirect.com/science/article/abs/pii/S0925231220306263)].
  url: https://hitleo.github.io/research/
