<!doctype html>

<html lang="en">
<head>
{% include head.html %}
</head>
<body class="intro-screen">

{% include header.html %}

  <!-- ==================== -->
  <!-- SECTION -->
  <!-- ==================== -->
  <body class="intro-screen">
    {% if site.data.publications.size > 0 %}
    <div class="container">
      <div class="row">
        <section class="col-md-9">
          <h3>{{page.title}}</h3>
          
          {% if page.image %}
          <p>
            <img src="{{ site.baseurl }}{{ page.image }}" 
                 class="img-responsive img-thumbnail"
                 style="width:200%">
          </p>
          {% endif %}

          <p> 
            <br> 
                {{content}}
            <br>
          </p>

          {% if page.image2 %}
          <p>
            <img src="{{ site.baseurl }}{{ page.image2 }}" 
                 class="img-responsive img-thumbnail"
                 style="width:100%">
          </p>
          {% endif %}

        </section>
      </div>
    </div>
    {% endif %}
  </body>
  
</html>
